  .title { font-size: 17px; font-weight: 700; fill: #2dd4bf; }
  .label { font-size: 13.5px; fill: #8b949e; }
  .value { font-size: 13.5px; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #8b949e; }
  .small { font-size: 12px; fill: #8b949e; }
</style>
<rect x="0.5" y="0.5" width="399" height="184" rx="12" fill="#0d1117" stroke="#30363d"/>
